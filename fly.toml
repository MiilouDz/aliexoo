# fly.toml app configuration file generated for aliexpress-service on 2026-09-19T11:00:58+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'aliexpress-service'
primary_region = 'cdg'

[build]
[env]
  KEEP_ALIVE = '0'
  STATE_FILE = '/data/channel_state.json'
  TELETHON_SESSION = '/data/monitor'

[processes]
  worker = 'python aliexpress_service.py'

[[mounts]]
  source = 'aliexpress_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
